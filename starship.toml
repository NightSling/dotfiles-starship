
palette = "catppuccin_mocha"

format = "[$directory](lavender) $character"
right_format = "$git_branch$git_status $golang$nodejs$rust$python$java$package$nix_shell$cmd_duration"

[character]
success_symbol = "[\\$](mauve)"
error_symbol = "[\\$](maroon)"
vimcmd_symbol = "[](blue)"
format = "$symbol "

[directory]
style = "lavender"
format = "[$path]($style)"

[git_branch]
symbol = ""
style = "peach"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "yellow"
format = '([$all_status]($style))'

[cmd_duration]
min_time = 2000
format = '[  $duration ](overlay2)'

[fill]
symbol = " "

[line_break]
disabled = false

[username]
disabled = true

[hostname]
disabled = true

# ──────── Language / Toolchain Modules ────────

[nodejs]
format = '[$symbol($version)](green) '
symbol = " "

[python]
format = '[$symbol$version]($style) '
symbol = " "
style = "blue"

[rust]
format = '[$symbol$version]($style) '
symbol = " "
style = "red"

[java]
format = '[$symbol$version]($style) '
symbol = " "
style = "yellow"

[golang]
format = '[$symbol$version]($style) '
symbol = " "                         # Nerd Font icon for Go
style = "sky"


[package]
format = '📦 [$version](lavender) '

[nix_shell]
format = '[ nix-shell](teal) '

# ───────────── Palette ─────────────

